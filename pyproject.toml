[project]
name = "twitter_bookmarks"
version = "0.1.0"
description = "Personal X (Twitter) bookmark categorization and weekly digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "anthropic>=0.40",
    "resend>=2.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "markdown>=3.7",
    "python-slugify>=8.0",
    "trafilatura>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twitter_bookmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
