<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}twitter_bookmarks{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    .chip { display: inline-block; padding: 0.1em 0.6em; margin: 0.1em; border-radius: 1em; background: var(--pico-secondary-background); font-size: 0.85em; }
    .chip.category { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
    .card { border: 1px solid var(--pico-muted-border-color); border-radius: 0.5em; padding: 1em; margin-bottom: 1em; }
    .meta { color: var(--pico-muted-color); font-size: 0.9em; }
  </style>
</head>
<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
